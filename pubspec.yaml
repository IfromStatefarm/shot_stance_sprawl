name: shot_stance_sprawl
description: Shadow wrestling drill assistant
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  in_app_purchase: ^3.2.3
  
  # Video Storage
  gal: ^2.3.0

  # Camera, Permissions & Storage
  camera: ^0.11.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  url_launcher: ^6.3.0

  # Audio Management
  audioplayers: ^6.5.1
  audio_session: ^0.1.25
  record: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/callouts/
    - assets/audio/ad_libs/
    - assets/images/keepkidswrestling_logo.png
    - assets/images/watermark logo transparent.png
    - assets/images/kkwloading_page.mp4
