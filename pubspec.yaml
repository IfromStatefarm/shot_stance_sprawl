name: shot_stance_sprawl
description: Shadow wrestling drill assistant
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  in_app_purchase: ^3.2.3
  crypto: ^3.0.7
  
  # Video Storage
  gal: ^2.3.0

  # Camera, Permissions & Storage
  camera: ^0.11.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_messaging: ^16.5.0
  firebase_app_check: ^0.4.6
  firebase_storage: ^13.6.0
  app_links: ^7.2.1
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0

  # Audio Management
  audioplayers: ^6.5.1
  audio_session: ^0.1.25
  record: ^6.1.2
  share_plus: ^13.1.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Android defines dev and prod product flavors. Use dev when no --flavor is
  # supplied so `flutter run` and `flutter build apk` select one APK.
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/callouts/
    - assets/audio/ad_libs/
    - assets/audio/voice_packs/
    - assets/images/keepkidswrestling_logo.png
    - assets/images/snap_and_go_background.png
    - assets/images/watermark logo transparent.png
    - assets/images/kkwloading_page.mp4
    - assets/images/callout_icons/
